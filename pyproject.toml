[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-enricher"
version = "0.2.0"
description = "CLI dla analityków SOC: wzbogacanie IoC (IP, domeny, URL, hashe) z oceną ryzyka"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ioc-enricher = "ioc_enricher.cli:run"

[tool.setuptools]
packages = ["ioc_enricher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
